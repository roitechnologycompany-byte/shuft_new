<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0033AA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066CC;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- Logo area -->
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="white">SHUFT</text>
  <text x="100" y="200" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.7)">.ONLINE</text>
  <!-- Divider -->
  <rect x="100" y="230" width="120" height="4" rx="2" fill="#FF6600"/>
  <!-- Main headline -->
  <text x="100" y="310" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="white">Фанкойлы Shuft в Москве</text>
  <text x="100" y="365" font-family="Arial, sans-serif" font-size="36" fill="rgba(255,255,255,0.85)">Официальный дилер</text>
  <!-- Features -->
  <text x="100" y="440" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.7)">✓ Гарантия 3 года  ✓ Монтаж за 1–3 дня  ✓ Склад в Москве</text>
  <!-- Phone -->
  <text x="100" y="510" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#FFB347">+7 (495) 120-33-75</text>
  <!-- Decorative circles -->
  <circle cx="950" cy="315" r="200" fill="rgba(255,255,255,0.05)"/>
  <circle cx="1050" cy="200" r="150" fill="rgba(255,255,255,0.04)"/>
</svg>
